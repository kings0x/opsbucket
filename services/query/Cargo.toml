[package]
name = "opsbucket-query"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clickhouse-rs = { version = "1", features = ["default"] }
redis = { version = "0.25", features = ["tokio-comp"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
opsbucket-shared = { path = "../shared" }
