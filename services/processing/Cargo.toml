[package]
name = "opsbucket-processing"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdkafka = { version = "0.36", features = ["cmake-build"] }
clickhouse = { version = "0.12", features = ["default"] }
redis = { version = "1", features = ["tokio-comp"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
opsbucket-shared = { path = "../shared" }
