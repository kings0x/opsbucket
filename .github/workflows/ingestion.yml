name: Ingestion

on:
  pull_request:
    branches: [develop, main]
    paths: ['services/ingestion/**', 'services/shared/**', '.github/workflows/ingestion.yml']
  push:
    branches: [develop]
    paths: ['services/ingestion/**', 'services/shared/**', '.github/workflows/ingestion.yml']

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies for librdkafka
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo build -p opsbucket-ingestion
      - run: cargo clippy -p opsbucket-ingestion -- -D warnings
      - run: cargo fmt --check
      - run: cargo test -p opsbucket-ingestion
