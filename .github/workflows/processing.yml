name: Processing

on:
  pull_request:
    branches: [develop, main]
    paths: ['services/processing/**', 'services/shared/**', 'services/Cargo.lock', '.github/workflows/processing.yml']
  push:
    branches: [develop]
    paths: ['services/processing/**', 'services/shared/**', 'services/Cargo.lock', '.github/workflows/processing.yml']

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    env:
      DATABASE_URL: postgres://opsbucket:opsbucket@127.0.0.1:5432/opsbucket
      REDIS_URL: redis://127.0.0.1:6379
      KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies for librdkafka
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Start infrastructure (Postgres, Redis, Redpanda, ClickHouse)
        run: docker compose -f ../infra/docker-compose.yml up -d postgres redis redpanda clickhouse
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f ../infra/docker-compose.yml exec -T postgres pg_isready -U opsbucket && break
            sleep 2
          done
      - name: Run Postgres migrations
        run: cargo run -p opsbucket-migrator -- up
      - name: Create Kafka topics
        run: |
          docker compose -f ../infra/docker-compose.yml exec -T redpanda rpk topic create raw-events --partitions 12 2>/dev/null || true
          docker compose -f ../infra/docker-compose.yml exec -T redpanda rpk topic create raw-events-dlq --partitions 1 2>/dev/null || true
          docker compose -f ../infra/docker-compose.yml exec -T redpanda rpk topic create replay_events --partitions 6 2>/dev/null || true
          docker compose -f ../infra/docker-compose.yml exec -T redpanda rpk topic create replay_events-dlq --partitions 1 2>/dev/null || true
      - run: cargo build -p opsbucket-processing
      - run: cargo clippy -p opsbucket-processing -- -D warnings
      - run: cargo fmt --check
      - run: cargo test -p opsbucket-processing -- --test-threads=1
