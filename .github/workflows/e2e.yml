name: End-to-End

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'services/ingestion/**'
      - 'services/processing/**'
      - 'services/query/**'
      - 'services/e2e/**'
      - 'services/shared/**'
      - 'services/migrator/**'
      - 'infra/**'
      - 'services/Cargo.lock'
      - '.github/workflows/e2e.yml'
  push:
    branches: [develop]
    paths:
      - 'services/ingestion/**'
      - 'services/processing/**'
      - 'services/query/**'
      - 'services/e2e/**'
      - 'services/shared/**'
      - 'services/migrator/**'
      - 'infra/**'
      - 'services/Cargo.lock'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libsasl2-dev \
            pkg-config \
            postgresql-client

      - name: Run standalone e2e harness
        working-directory: services
        run: cargo run -p opsbucket-e2e
