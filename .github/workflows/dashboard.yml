name: Dashboard

on:
  pull_request:
    branches: [develop, main]
    paths: ['services/dashboard/**', 'services/shared/**', '.github/workflows/dashboard.yml']
  push:
    branches: [develop]
    paths: ['services/dashboard/**', 'services/shared/**', '.github/workflows/dashboard.yml']
  release:
    types: [published]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    env:
      DATABASE_URL: postgres://opsbucket:opsbucket@127.0.0.1:5432/opsbucket
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/dashboard/frontend/package-lock.json

      - name: Build frontend
        working-directory: services/dashboard/frontend
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libssl-dev \
            libsasl2-dev \
            pkg-config

      - name: Start infrastructure (Postgres, Redis)
        run: docker compose -f ../infra/docker-compose.yml up -d postgres redis
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose -f ../infra/docker-compose.yml exec -T postgres pg_isready -U opsbucket && break
            sleep 2
          done
      - name: Run Postgres migrations
        run: cargo run -p opsbucket-migrator -- up
      - run: cargo build -p opsbucket-dashboard
      - run: cargo clippy -p opsbucket-dashboard -- -D warnings
      - run: cargo fmt --check
      - run: cargo test -p opsbucket-dashboard -- --test-threads=1

  docker:
    if: github.event_name == 'release'
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/dashboard:latest
            ghcr.io/${{ github.repository }}/dashboard:${{ github.sha }}
