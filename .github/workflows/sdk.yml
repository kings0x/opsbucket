name: SDK

on:
  pull_request:
    branches: [develop, main]
    paths: ['sdk/**']
  push:
    branches: [develop]
    paths: ['sdk/**']

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --filter opsbucket-js lint
      - run: pnpm --filter opsbucket-js typecheck
      - run: pnpm --filter opsbucket-js test
